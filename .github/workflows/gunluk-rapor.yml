name: Günlük Makro Rapor

on:
  schedule:
    - cron: "30 2 * * 1-5"   # Hafta içi 02:30 UTC = 05:30 TSİ
  workflow_dispatch:          # "Run workflow" butonuyla elle çalıştırma

permissions:
  contents: write

concurrency:
  group: makro-rapor
  cancel-in-progress: false

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Raporu üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py

      - name: Raporu kaydet
        run: |
          git config user.name "makro-rapor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Makro rapor $(TZ=Europe/Istanbul date +%F)" || echo "Değişiklik yok"
          git push
